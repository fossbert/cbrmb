[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cbrmb"
version = "0.1.0"
description = "Microbiome analysis helpers: statistical tests, feature filtering, ordination, longitudinal normalization"
authors = [{ name = "H. Carlo Maurer", email = "h.carlo.maurer@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["microbiome", "16S", "amplicon", "differential-abundance", "unifrac", "permanova"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=2.2.0",       # groupby.apply semantics used by the *_test helpers
    "scipy>=1.11.0",
    "statsmodels>=0.13",   # multipletests
    "scikit-learn>=1.6",   # MDS in ordination; cbrmb.ml (validate_data, sklearn tags)
]

[project.optional-dependencies]
anndata = ["anndata>=0.9"]
umap = ["umap-learn>=0.5"]
r = ["rpy2>=3.5"]          # plus R packages: ape, phangorn, GUniFrac, NbClust
plotting = ["matplotlib>=3.5", "cbrviz>=0.1"]  # cbrviz backs OrdinationReport.plot
all = ["cbrmb[anndata,umap,r,plotting]"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/fossbert/cbrmb"
Issues = "https://github.com/fossbert/cbrmb/issues"

[tool.setuptools.packages.find]
include = ["cbrmb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
