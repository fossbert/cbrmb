name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # ktspy and cvkit are not on PyPI ("cvkit" there is an unrelated project)
          pip install "ktspy @ git+https://github.com/fossbert/ktspy.git" \
                      "cvkit @ git+https://github.com/fossbert/cvkit.git"
          pip install -e ".[anndata,umap,test]"
      - name: Test
        run: pytest -q
